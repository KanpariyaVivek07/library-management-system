{% extends "base.html" %}
{% block title %}Pay Fine - LibManager Pro{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:40px auto">
    <div style="text-align:center;margin-bottom:24px">
        <div style="width:60px;height:60px;background:#fee2e2;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.5rem;color:var(--danger)"><i class="fas fa-dollar-sign"></i></div>
        <h2>Pay Fine</h2>
        <p style="color:var(--gray);font-size:0.9rem;margin-top:4px">Clear your outstanding balance</p>
    </div>
    <div style="text-align:center;padding:20px;background:#fee2e2;border-radius:10px;margin-bottom:20px">
        <p style="color:var(--gray);font-size:0.85rem;margin-bottom:4px">Outstanding Fine</p>
        <p style="font-size:2rem;font-weight:700;color:var(--danger)">${{ "%.2f"|format(fine_due) }}</p>
    </div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label><i class="fas fa-money-bill-wave"></i> Amount to Pay ($)</label>
            <input type="number" step="0.01" min="0.01" max="{{ fine_due }}" name="amount" class="form-control" placeholder="0.00" required>
        </div>
        <button type="submit" class="btn btn-danger btn-lg" style="width:100%;margin-top:10px"><i class="fas fa-credit-card"></i> Pay Fine</button>
    </form>
</div>
{% endblock %}
