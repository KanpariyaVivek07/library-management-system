{% extends "base.html" %}
{% block title %}Edit Book - LibManager Pro{% endblock %}
{% block content %}
<div style="max-width:650px;margin:20px auto">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
        <a href="/books" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:1.6rem;font-weight:700"><i class="fas fa-edit"></i> Edit Book</h1>
    </div>
    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fas fa-book"></i> Title</label>
                    <input type="text" value="{{ title }}" class="form-control" disabled>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-edit"></i> Author</label>
                    <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fas fa-hashtag"></i> ISBN</label>
                    <input type="text" name="isbn" class="form-control" value="{{ book.isbn or '' }}" placeholder="Optional">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-link"></i> Cover Image URL</label>
                    <input type="text" name="cover" class="form-control" value="{{ book.cover or '' }}" placeholder="Or paste image URL">
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-upload"></i> Upload New Cover</label>
                <input type="file" name="cover_file" class="form-control" accept="image/*" onchange="previewCover(this)">
                <small style="color:var(--gray)">PNG, JPG, GIF, WebP - Max 2MB</small>
            </div>
            {% if book.cover %}
            <div style="margin-bottom:16px;text-align:center">
                <p style="font-size:0.85rem;color:var(--gray);margin-bottom:8px">Current Cover:</p>
                <img src="{{ book.cover }}" alt="Current Cover" style="max-width:120px;max-height:160px;border-radius:8px;border:2px solid var(--border)">
            </div>
            {% endif %}
            <div id="coverPreview" style="display:none;margin-bottom:16px;text-align:center">
                <p style="font-size:0.85rem;color:var(--gray);margin-bottom:8px">New Cover Preview:</p>
                <img id="previewImg" src="" alt="Preview" style="max-width:120px;max-height:160px;border-radius:8px;border:2px solid var(--primary)">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Category</label>
                    <select name="category" class="form-control">
                        {% for cat in categories %}
                            <option value="{{ cat }}" {% if book.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-clipboard-check"></i> Condition</label>
                    <select name="condition" class="form-control">
                        {% for cond in conditions %}
                            <option value="{{ cond }}" {% if book.condition == cond %}selected{% endif %}>{{ cond }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fas fa-dollar-sign"></i> Price ($)</label>
                    <input type="number" step="0.01" min="0.01" name="price" class="form-control" value="{{ book.price }}" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-cubes"></i> Available Copies</label>
                    <input type="number" min="0" name="copies" class="form-control" value="{{ book.available_copies }}" required>
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-database"></i> Total Copies</label>
                <input type="number" min="0" name="total_copies" class="form-control" value="{{ book.total_copies }}" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:10px"><i class="fas fa-save"></i> Update Book</button>
        </form>
    </div>
</div>
<script>
function previewCover(input) {
    if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewImg').src = e.target.result;
            document.getElementById('coverPreview').style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
