{% extends "base.html" %}
{% block title %}Register - LibManager Pro{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:50px auto">
    <div style="text-align:center;margin-bottom:24px">
        <div style="width:60px;height:60px;background:linear-gradient(135deg,var(--success),#38ef7d);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.5rem;color:#fff"><i class="fas fa-user-plus"></i></div>
        <h2>Create Account</h2>
        <p style="color:var(--gray);font-size:0.9rem;margin-top:4px">Join your library community</p>
    </div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" name="password" class="form-control" placeholder="Min 4 characters" minlength="4" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Confirm Password</label>
            <input type="password" name="confirm" class="form-control" placeholder="Confirm password" required>
        </div>
        <button type="submit" class="btn btn-success btn-lg" style="width:100%;margin-top:10px"><i class="fas fa-user-plus"></i> Create Account</button>
    </form>
    <p style="text-align:center;margin-top:20px;color:var(--gray);font-size:0.9rem">
        Already have an account? <a href="/login" style="color:var(--primary);font-weight:600;text-decoration:none">Sign in</a>
    </p>
</div>
{% endblock %}
