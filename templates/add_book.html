{% extends "base.html" %}
{% block title %}Add Book - LibManager Pro{% endblock %}
{% block content %}
<div style="max-width:650px;margin:20px auto">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
        <a href="/books" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i></a>
        <h1 style="font-size:1.6rem;font-weight:700"><i class="fas fa-plus-circle"></i> Add New Book</h1>
    </div>
    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fas fa-book"></i> Book Title</label>
                    <input type="text" name="title" class="form-control" placeholder="Enter book title" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-edit"></i> Author</label>
                    <input type="text" name="author" class="form-control" placeholder="Enter author name" required>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fas fa-hashtag"></i> ISBN</label>
                    <input type="text" name="isbn" class="form-control" placeholder="Optional ISBN">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-link"></i> Cover Image URL</label>
                    <input type="text" name="cover" class="form-control" placeholder="Or paste image URL">
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-upload"></i> Upload Cover Image</label>
                <input type="file" name="cover_file" class="form-control" accept="image/*" onchange="previewCover(this)">
                <small style="color:var(--gray)">PNG, JPG, GIF, WebP - Max 2MB</small>
            </div>
            <div id="coverPreview" style="display:none;margin-bottom:16px;text-align:center">
                <img id="previewImg" src="" alt="Preview" style="max-width:150px;max-height:200px;border-radius:8px;border:2px solid var(--border)">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Category</label>
                    <select name="category" class="form-control" required>
                        {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-clipboard-check"></i> Condition</label>
                    <select name="condition" class="form-control" required>
                        {% for cond in conditions %}
                            <option value="{{ cond }}">{{ cond }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fas fa-dollar-sign"></i> Price ($)</label>
                    <input type="number" step="0.01" min="0.01" name="price" class="form-control" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-cubes"></i> Copies</label>
                    <input type="number" min="1" name="copies" class="form-control" placeholder="1" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success btn-lg" style="width:100%;margin-top:10px"><i class="fas fa-plus-circle"></i> Add Book</button>
        </form>
    </div>
</div>
<script>
function previewCover(input) {
    if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewImg').src = e.target.result;
            document.getElementById('coverPreview').style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
