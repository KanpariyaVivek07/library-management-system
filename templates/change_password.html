{% extends "base.html" %}
{% block title %}Change Password - LibManager Pro{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:40px auto">
    <div style="text-align:center;margin-bottom:24px">
        <div style="width:60px;height:60px;background:#fef3c7;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.5rem;color:var(--warning)"><i class="fas fa-shield-alt"></i></div>
        <h2>Change Password</h2>
        <p style="color:var(--gray);font-size:0.9rem;margin-top:4px">Update your account security</p>
    </div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Current Password</label>
            <input type="password" name="current" class="form-control" placeholder="Enter current password" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-key"></i> New Password</label>
            <input type="password" name="new_password" class="form-control" placeholder="Min 4 characters" minlength="4" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-check-double"></i> Confirm Password</label>
            <input type="password" name="confirm" class="form-control" placeholder="Confirm new password" required>
        </div>
        <button type="submit" class="btn btn-warning btn-lg" style="width:100%;margin-top:10px"><i class="fas fa-save"></i> Update Password</button>
    </form>
</div>
{% endblock %}
